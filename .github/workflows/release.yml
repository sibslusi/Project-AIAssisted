name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/sibslusi/project-aiassisted

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Lint and architecture
        run: |
          ruff check .
          ruff format --check .
          PYTHONPATH=src lint-imports

      - name: Run unit, integration and E2E tests with coverage
        run: pytest --cov=src/app --cov-report=term-missing --cov-fail-under=90

  image:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: release
          POSTGRES_PASSWORD: release-only-password
          POSTGRES_DB: release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U release -d release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install smoke-test dependencies
        run: python -m pip install -r requirements.txt

      - name: Build image
        run: |
          docker build \
            --build-arg APP_VERSION=${{ github.ref_name }} \
            --tag "$IMAGE_NAME:${{ github.ref_name }}" \
            --tag "$IMAGE_NAME:sha-${GITHUB_SHA::7}" \
            .

      - name: Run E2E tests in the built image against Postgres
        run: |
          docker run --rm --network host \
            -v "$PWD/tests:/app/tests:ro" \
            -v "$PWD/pyproject.toml:/app/pyproject.toml:ro" \
            -e DATABASE_URL=postgresql+psycopg://release:release-only-password@localhost:5432/release \
            -e SESSION_SECRET=e2e-only-secret \
            -e DEMO_PASSWORD=demo-password \
            --entrypoint sh \
            "$IMAGE_NAME:${{ github.ref_name }}" \
            -c "alembic upgrade head && python -m pytest -p no:cacheprovider -q tests/e2e"

      - name: Start container against Postgres
        shell: bash
        run: |
          set -euo pipefail
          demo_password="$(openssl rand -hex 16)"
          echo "::add-mask::$demo_password"
          echo "DEMO_PASSWORD=$demo_password" >> "$GITHUB_ENV"
          docker run --detach --name app --network host \
            -e DATABASE_URL=postgresql+psycopg://release:release-only-password@localhost:5432/release \
            -e SESSION_SECRET="$(openssl rand -hex 32)" \
            -e DEMO_PASSWORD="$demo_password" \
            -e RUN_SEED=true \
            "$IMAGE_NAME:${{ github.ref_name }}"

      - name: Smoke test container
        env:
          BASE_URL: http://localhost:8000
          EXPECTED_VERSION: ${{ github.ref_name }}
          SMOKE_EMAIL: ma@mail.ch
          SMOKE_TIMEOUT_SECONDS: "120"
        run: python scripts/smoke_test.py

      - name: Show container logs on failure
        if: failure()
        run: docker logs app

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: startsWith(github.ref, 'refs/tags/v')
        id: push
        shell: bash
        run: |
          set -euo pipefail
          docker push "$IMAGE_NAME:${{ github.ref_name }}"
          docker push "$IMAGE_NAME:sha-${GITHUB_SHA::7}"
          repo_digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE_NAME:${{ github.ref_name }}")"
          echo "digest=${repo_digest#*@}" >> "$GITHUB_OUTPUT"
          echo "Image: $repo_digest"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  deploy:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    permissions:
      contents: read
    uses: ./.github/workflows/cd.yml
    with:
      image: ghcr.io/sibslusi/project-aiassisted@${{ needs.image.outputs.digest }}
      version: ${{ github.ref_name }}
    secrets: inherit
