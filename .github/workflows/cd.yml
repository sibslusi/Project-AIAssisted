name: CD

on:
  workflow_call:
    inputs:
      image:
        description: Geprüftes Image mit Digest (ghcr.io/...@sha256:...)
        required: true
        type: string
      version:
        description: Erwartete Version in /health
        required: true
        type: string
  workflow_dispatch:
    inputs:
      image:
        description: Geprüftes Image mit Digest (ghcr.io/...@sha256:...)
        required: true
        type: string
      version:
        description: Erwartete Version in /health
        required: true
        type: string

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check deployment configuration
        id: check
        env:
          CD_ENABLED: ${{ vars.CD_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$CD_ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "CD ist inaktiv. Nach dem Einrichten von Render CD_ENABLED=true im Environment production setzen."
          fi

  deploy:
    needs: preflight
    if: needs.preflight.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install smoke-test dependencies
        run: python -m pip install -r requirements.txt

      - name: Deploy validated image to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ${{ inputs.image }}
        run: ./scripts/deploy.sh

      - name: Run post-deployment smoke test
        env:
          BASE_URL: ${{ vars.RENDER_SERVICE_URL }}
          EXPECTED_VERSION: ${{ inputs.version }}
          SMOKE_EMAIL: ${{ vars.SMOKE_EMAIL }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: python scripts/smoke_test.py
