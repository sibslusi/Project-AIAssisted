{% extends "page.html" %}
{% block page_content %}
<form class="form-panel" action="/datenschutz/zuweisungen" method="post">
  <label for="module_id">Modul</label>
  <select id="module_id" name="module_id" required>{% for module in modules %}<option value="{{ module.id }}">{{ module.id }}</option>{% endfor %}</select>
  <label for="department_id">Abteilung</label>
  <select id="department_id" name="department_id" required>{% for department in departments %}<option value="{{ department.id }}">{{ department.id }}</option>{% endfor %}</select>
  <label for="due_date">Frist</label>
  <input id="due_date" name="due_date" type="date" required>
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <button type="submit">Zuweisung speichern</button>
</form>
<ul class="module-list">{% for assignment in assignments %}<li><span>{{ assignment.id }}</span><a href="/api/assignments/{{ assignment.id }}/training-evidence.csv">CSV-Nachweis</a></li>{% endfor %}</ul>
{% endblock %}
